<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Education x TƯ Duy Mở- Nâng tầm tri thức, Bứt phá tư duy</title>
    
    <!-- YỂM BÙA PRELOAD: Ưu tiên tải logo.webp ngay lập tức -->
    <link rel="preload" as="image" href="logo.webp">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CÀI ĐẶT CƠ BẢN (DARK MODE) --- */
        :root {
            --primary-red: #ff4d4d; /* Đỏ sáng cho Dark Mode */
            --dark-red: #b71c1c;
            --light-red: rgba(255, 77, 77, 0.15);
            --bg-color: #18112e; /* Màu nền vũ trụ */
            --bg-card: rgba(30, 30, 40, 0.8); /* Nền khối tối mờ */
            --text-main: #e2e8f0; /* Chữ màu sáng */
            --text-muted: #a0aec0;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(255, 255, 255, 0.05);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header {
            background: rgba(15, 15, 20, 0.9); backdrop-filter: blur(10px); 
            padding: 35px 20px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 4px solid var(--dark-red);
        }
        .header-logo-container { margin-bottom: 12px; }
        
        /* LOGO BỎ BO TRÒN VÀ VIỀN */
        .web-icon-img {
            width: 80px; height: 80px; object-fit: contain;
            background-color: transparent;
            filter: drop-shadow(0 0 10px rgba(183, 28, 28, 0.5));
        }
        
        header h1 {
            margin: 0; font-size: 28px; font-weight: 800;
            color: var(--primary-red); text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(183, 28, 28, 0.3);
        }
        header p { margin: 5px 0 0; font-size: 16px; color: var(--text-muted); font-style: italic; }

        /* --- CONTAINER & SEARCH --- */
        .container { max-width: 750px; margin: 30px auto; padding: 0 20px; min-height: 50vh; }
        .search-box {
            background: var(--bg-card); padding: 12px 20px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 25px;
            display: flex; align-items: center; border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }
        .search-box i { color: #a0aec0; margin-right: 12px; font-size: 16px; }
        .search-box input {
            border: none; outline: none; width: 100%; font-size: 15px; color: var(--text-main); background: transparent;
        }
        .search-box input::placeholder { color: #718096; }

        /* --- ACCORDION --- */
        .topic-item {
            margin-bottom: 12px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            background-color: transparent; overflow: hidden; border: 1px solid var(--border-color);
        }
        .topic-header {
            background: var(--bg-card); color: var(--text-main); padding: 18px 20px;
            font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; transition: all 0.3s ease;
        }
        .topic-item.active > .topic-header { background: linear-gradient(135deg, var(--dark-red), #e53935); color: #ffffff; border-color: transparent; }
        .topic-header i.fa-chevron-right { font-size: 14px; transition: transform 0.3s ease; }
        .topic-item.active > .topic-header i.fa-chevron-right { transform: rotate(90deg); }
        .topic-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease-out; background-color: rgba(20, 20, 30, 0.5); }
        .topic-item.active > .topic-content { grid-template-rows: 1fr; }
        .topic-content-wrapper { overflow: hidden; }

        .sub-topic-item { border-top: 1px solid var(--border-color); background-color: transparent; }
        .sub-topic-header {
            padding: 16px 20px 16px 30px; font-size: 15px; font-weight: 600; color: var(--text-main); background: var(--bg-card);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; transition: background-color 0.2s;
        }
        .sub-topic-header:hover { background-color: var(--hover-bg); }
        .sub-topic-header i.fa-chevron-right { font-size: 13px; color: #a0aec0; transition: transform 0.3s ease; }
        .sub-topic-item.active > .sub-topic-header i.fa-chevron-right { transform: rotate(90deg); }
        .sub-topic-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease-out; background-color: rgba(10, 10, 15, 0.3); }
        .sub-topic-item.active > .sub-topic-content { grid-template-rows: 1fr; }
        .sub-topic-content-wrapper { overflow: hidden; }
        .sub-topic-content-inner { padding: 15px 20px 20px 45px; }

        .topic-content-inner { padding: 20px; }
        .resource-section { margin-bottom: 20px; }
        .resource-section:last-child { margin-bottom: 0; }
        .resource-title {
            font-size: 14px; font-weight: 700; color: var(--primary-red); margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 2px solid var(--border-color); display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }
        .resource-list { list-style: none; padding: 0; margin: 0; }
        .resource-list li { padding: 8px 10px; display: flex; align-items: center; gap: 12px; border-radius: 6px; transition: background 0.2s ease; }
        .resource-list li:hover { background-color: var(--hover-bg); }
        .resource-list a { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 500; transition: color 0.2s; flex-grow: 1; word-break: break-word; }
        .resource-list a:hover { color: var(--primary-red); }

        .empty-state { color: #94a3b8; font-size: 14px; font-style: italic; margin: 5px 0 10px 10px; }
        .fa-file-lines { color: #e53935; font-size: 16px; }
        .fa-pen-to-square { color: #ffb300; font-size: 16px; }
        .fa-circle-play { color: #1e88e5; font-size: 16px; }
        .loading-text { text-align: center; color: var(--primary-red); font-weight: bold; margin-top: 20px; }

        /* --- POSTER QUẢNG CÁO --- */
        .poster-container {
            margin-top: 40px;
            width: 100%;
            text-align: center;
        }
        .promo-poster {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }
        .promo-poster:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(183,28,28,0.3);
        }

        footer {
            text-align: center; padding: 25px; margin-top: 60px;
            background-color: rgba(5, 5, 10, 0.95); color: #a0aec0; font-size: 14px; font-weight: 500; border-top: 4px solid var(--dark-red);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-logo-container">
            <img src="logo.webp" alt="Space Education Logo" class="web-icon-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3242/3242257.png'">
        </div>
        <h1>Space Education x Tư Duy Mở</h1>
        <p>Nâng tầm tri thức, Bứt phá tư duy</p>
    </header>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm bài giảng...">
        </div>
        
        <!-- Khung chứa dữ liệu bài giảng -->
        <div id="topics-container">
            <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu từ Google Sheets...</div>
        </div>

        <!-- KHU VỰC CHỨA POSTER -->
        <div class="poster-container">
            <img src="poster.webp" alt="Space Education Poster" class="promo-poster" onerror="this.style.display='none'">
        </div>
    </div>

    <footer>Thiết kế bởi PGS.TS Nguyễn Bình Minh</footer>

    <script>
        // LINK GOOGLE SHEETS
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1iXs0phcpJYR9LM29Uj7y0GXoeEFIROwJA2ihVft3-TApIa9B4t2TsAcnUtFZIGPVw8CF7KUBaplj/pub?output=csv';

        document.addEventListener('DOMContentLoaded', () => {
            // ĐÃ XÓA HIỆU ỨNG INTRO THEO YÊU CẦU
            // Gọi hàm tải dữ liệu Google Sheets ngay lập tức
            loadGoogleSheetsData();
        });

        // Hàm đọc và phân tích file CSV
        function parseCSV(str) {
            const arr = [];
            let quote = false;  
            let col, c;
            for (let row = col = c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }  
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        async function loadGoogleSheetsData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('Không thể kết nối đến Google Sheets');
                const csvText = await response.text();
                
                const rawData = parseCSV(csvText);
                const jsonData = transformData(rawData);
                renderData(jsonData);
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('topics-container').innerHTML = 
                    `<div class="empty-state" style="text-align:center; color: #ff4d4d;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Không thể tải dữ liệu từ Google Sheets. <br>
                        Vui lòng kiểm tra lại đường link hoặc xem bảng tính đã bật "Bất kỳ ai cũng có thể xem" chưa.
                    </div>`;
            }
        }

        // Chuyển đổi dữ liệu bảng tính thành cấu trúc JSON
        function transformData(rows) {
            const dataMap = new Map();
            
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                if (cols.length < 5) continue; 
                
                const mainTopic = cols[0]?.trim();
                const subTopic = cols[1]?.trim();
                const typeStr = cols[2]?.trim().toLowerCase();
                const itemTitle = cols[3]?.trim();
                const itemUrl = cols[4]?.trim();

                if (!mainTopic || !itemTitle || !itemUrl) continue;

                if (!dataMap.has(mainTopic)) {
                    dataMap.set(mainTopic, {
                        title: mainTopic,
                        type: subTopic ? 'nested' : 'direct',
                        subtopics: [],
                        lectures: [],
                        exercises: [],
                        videos: []
                    });
                }

                const mainObj = dataMap.get(mainTopic);
                const resourceItem = { title: itemTitle, url: itemUrl };

                if (subTopic) {
                    mainObj.type = 'nested';
                    let subObj = mainObj.subtopics.find(s => s.title === subTopic);
                    if (!subObj) {
                        subObj = { title: subTopic, lectures: [], exercises: [], videos: [] };
                        mainObj.subtopics.push(subObj);
                    }
                    
                    if (typeStr.includes('giảng')) subObj.lectures.push(resourceItem);
                    else if (typeStr.includes('tập')) subObj.exercises.push(resourceItem);
                    else if (typeStr.includes('video') || typeStr.includes('chữa')) subObj.videos.push(resourceItem);
                    
                } else {
                    if (typeStr.includes('giảng')) mainObj.lectures.push(resourceItem);
                    else if (typeStr.includes('tập')) mainObj.exercises.push(resourceItem);
                    else if (typeStr.includes('video') || typeStr.includes('chữa')) mainObj.videos.push(resourceItem);
                }
            }
            return Array.from(dataMap.values());
        }

        function renderData(data) {
            const container = document.getElementById('topics-container');
            if(data.length === 0) {
                container.innerHTML = `<p class="empty-state" style="text-align:center;">Chưa có dữ liệu bài giảng nào.</p>`;
                return;
            }

            let html = '';
            data.forEach(topic => {
                html += `<div class="topic-item">
                            <div class="topic-header">
                                <span>${topic.title}</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                            <div class="topic-content">
                                <div class="topic-content-wrapper">`;
                
                if (topic.type === 'nested') {
                    topic.subtopics.forEach(sub => {
                        html += `
                        <div class="sub-topic-item">
                            <div class="sub-topic-header">
                                <span>${sub.title}</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                            <div class="sub-topic-content">
                                <div class="sub-topic-content-wrapper">
                                    <div class="sub-topic-content-inner">
                                        ${buildResourceHTML(sub)}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    });
                } else if (topic.type === 'direct') {
                    html += `
                        <div class="topic-content-inner">
                            ${buildResourceHTML(topic)}
                        </div>`;
                }

                html += `       </div>
                            </div>
                        </div>`;
            });

            container.innerHTML = html;
            attachEvents();
        }

        function buildResourceHTML(item) {
            const hasLectures = item.lectures && item.lectures.length > 0;
            const hasExercises = item.exercises && item.exercises.length > 0;
            const hasVideos = item.videos && item.videos.length > 0;

            if (!hasLectures && !hasExercises && !hasVideos) {
                return `<p class="empty-state">Đang cập nhật nội dung...</p>`;
            }

            let resHtml = '';
            resHtml += `<div class="resource-section"><div class="resource-title"><i class="fa-solid fa-book"></i> Bài giảng</div>`;
            if (hasLectures) resHtml += buildListHTML(item.lectures, 'fa-file-lines');
            else resHtml += `<p class="empty-state">Hiện tại chưa có bài giảng</p>`;
            resHtml += `</div>`;

            resHtml += `<div class="resource-section"><div class="resource-title"><i class="fa-solid fa-pen-fancy"></i> Bài tập</div>`;
            if (hasExercises) resHtml += buildListHTML(item.exercises, 'fa-pen-to-square');
            else resHtml += `<p class="empty-state">Hiện tại chưa có bài tập</p>`;
            resHtml += `</div>`;

            resHtml += `<div class="resource-section"><div class="resource-title"><i class="fa-solid fa-video"></i> Video chữa bài</div>`;
            if (hasVideos) resHtml += buildListHTML(item.videos, 'fa-circle-play');
            else resHtml += `<p class="empty-state">Hiện tại chưa có video chữa</p>`;
            resHtml += `</div>`;

            return resHtml;
        }

        function buildListHTML(arr, iconClass) {
            let list = `<ul class="resource-list">`;
            arr.forEach(obj => {
                list += `<li><i class="fa-solid ${iconClass}"></i> <a href="${obj.url}" target="_blank">${obj.title}</a></li>`;
            });
            list += `</ul>`;
            return list;
        }

        function attachEvents() {
            const accordions = document.querySelectorAll('.topic-header, .sub-topic-header');
            accordions.forEach(header => {
                header.addEventListener('click', function(e) {
                    e.stopPropagation(); 
                    const item = this.parentElement;
                    item.classList.toggle('active');
                });
            });

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase();
                const topics = document.querySelectorAll('.topic-item');

                topics.forEach(topic => {
                    const text = topic.querySelector('.topic-header span').textContent.toLowerCase();
                    if(text.includes(filter)) {
                        topic.style.display = "";
                    } else {
                        topic.style.display = "none";
                    }
                });
            });
        }
    </script>
</body>
</html>
